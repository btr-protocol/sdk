# CI: the SDK is a standalone package. Tests that need closed-source contract
# artifacts skip on an sdk-only checkout by design; nothing here materialises siblings.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Bun tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The ABI pin test reads the backend's served copies from the sibling checkout. back is
      # private and pinned, like every sibling checkout across the repos.
      - run: |
          git clone -q --filter=blob:none --no-checkout \
            "https://x-access-token:${{ secrets.CI_SIBLING_TOKEN }}@github.com/btr-protocol/back" ../back
          git -C ../back sparse-checkout set abis
          git -C ../back checkout -q 7da4c6f95cf3a945f514a09050ddbb62ef282e24
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run lint
