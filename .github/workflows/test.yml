# CI: the SDK mirrors contract surfaces it does not own, so the siblings that own them are
# materialised here, pinned. They used to be absent and `solidity-mirror.test.ts` skipped itself —
# a green run that proved nothing about the one thing the file exists to prove.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Bun tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      # The ABI pin test reads the backend's served copies from the sibling checkout. back is
      # private and pinned, like every sibling checkout across the repos.
      - run: |
          git clone -q --filter=blob:none --no-checkout \
            "https://x-access-token:${{ secrets.CI_SIBLING_TOKEN }}@github.com/btr-protocol/back" ../back
          git -C ../back sparse-checkout set abis
          git -C ../back checkout -q d5a79f6c1dcccaac9d4a6a62337e634582de0fc5
      # The solidity mirror test re-parses the DECLARING sources; it hard-fails without them.
      - run: |
          git clone -q --filter=blob:none --no-checkout \
            "https://x-access-token:${{ secrets.CI_SIBLING_TOKEN }}@github.com/btr-protocol/dex-evm" ../dex-evm
          git -C ../dex-evm sparse-checkout set src abi
          git -C ../dex-evm checkout -q 5b52b93d2044bf89e3a5b29ab20ec1e69a3a0ce0
          git clone -q --filter=blob:none --no-checkout \
            "https://x-access-token:${{ secrets.CI_SIBLING_TOKEN }}@github.com/btr-protocol/shared" ../shared
          git -C ../shared sparse-checkout set evm/src
          git -C ../shared checkout -q 4354807e54a21949ee3088146ea94c33e5c284e4
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run lint
