# CI: the SDK is a standalone package. Tests that need closed-source contract
# artifacts skip on an sdk-only checkout by design; nothing here materialises siblings.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: Bun tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
