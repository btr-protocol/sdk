# CI: the SDK mirrors contract surfaces it does not own, so the siblings that own them are
# materialised here, pinned. They used to be absent and `solidity-mirror.test.ts` skipped itself —
# a green run that proved nothing about the one thing the file exists to prove.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Bun tests + typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      # Siblings are private, pinned and cloned with a one-shot auth header: the token is passed to each
      # git command via `-c http.extraheader` (env, masked), never written to .git/config or a remote
      # URL, so the bun install and tests below (PR code) cannot read it from disk.
      # The ABI pin test reads the backend's served copies from the sibling checkout. back pins sdk in
      # turn, so pin back at a commit whose abis/ matches its head, not at the commit that bumps back's pins.
      # The solidity mirror test re-parses the DECLARING sources (dex-evm, shared); it hard-fails without them.
      - name: Sibling checkouts (pinned, credential not persisted)
        env:
          CI_SIBLING_TOKEN: ${{ secrets.CI_SIBLING_TOKEN }}
        run: |
          set -euo pipefail
          AUTH=$(printf 'x-access-token:%s' "$CI_SIBLING_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          g() { git -c "http.extraheader=AUTHORIZATION: basic $AUTH" "$@"; }
          sib() { # name sparse-paths... sha
            local n=$1 sha=${!#}; local paths=("${@:2:$#-2}")
            g clone -q --filter=blob:none --no-checkout "https://github.com/btr-protocol/$n" "../$n"
            git -C "../$n" sparse-checkout set "${paths[@]}"
            g -C "../$n" checkout -q "$sha"
          }
          sib back abis 98ba3b66116af0e3ac57f8286cbcb15a7a253478
          sib dex-evm src abi deployments b9c775e227330bc1ebb8547f61d24def927f48b9
          sib shared evm/src 1f2d4fc4b75658543ea33dc8abb571245a7cab11
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run lint
