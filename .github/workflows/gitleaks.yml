name: gitleaks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
          # Full history: a shallow clone gives `gitleaks git` one commit, and a secret added then
          # removed inside a PR's commits never reaches the tree scan.
          fetch-depth: 0
      - name: Install gitleaks v8.30.1 (sha256-verified)
        run: |
          f=gitleaks_8.30.1_linux_x64.tar.gz
          curl -sSfL -o "$RUNNER_TEMP/$f" "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/$f"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/$f" | sha256sum -c -
          mkdir "$RUNNER_TEMP/gl" && tar -xzf "$RUNNER_TEMP/$f" -C "$RUNNER_TEMP/gl" gitleaks
          echo "$RUNNER_TEMP/gl" >> "$GITHUB_PATH"
      - name: Allowlist self-test
        run: scripts/test-gitleaks.sh
      - name: Scan tree
        run: gitleaks dir --no-banner --redact -c .gitleaks.toml .
      # The tree is the current commit only; every clone carries the history, so scan it too.
      - name: Scan history
        run: gitleaks git --no-banner --redact -c .gitleaks.toml .
